<article class="card project">
  <a class="project-img" href="{{ p.get_absolute_url }}" tabindex="-1" aria-hidden="true">
    {% if p.image %}<img src="{{ p.image.url }}" alt="" loading="lazy" width="800" height="500">{% else %}<span class="img-fallback"><i class="fa-solid fa-code"></i></span>{% endif %}
  </a>
  <div class="project-body">
    <h3><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></h3>
    <p>{{ p.short_description }}</p>
    <ul class="tags">{% for t in p.tech_list %}<li>{{ t }}</li>{% endfor %}</ul>
    <div class="project-links">
      {% if p.github_url %}<a class="btn btn-ghost btn-small" href="{{ p.github_url }}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> GitHub</a>{% endif %}
      {% if p.live_url %}<a class="btn btn-small" href="{{ p.live_url }}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live demo</a>{% endif %}
    </div>
  </div>
</article>
